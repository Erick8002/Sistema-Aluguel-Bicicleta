services:
  db:
    image: postgres:18
    container_name: postgres_bicicleta
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "8524"
      POSTGRES_DB: Sistema_Aluguel_Biblioteca
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: